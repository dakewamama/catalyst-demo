<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="One view for permissions across Solana, backed by native evidence." />
    <title>Velon | My permissions</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Velon</a>
      <div class="header-links"><span class="badge">Native fixture replay</span></div>
      <section class="wallet-panel" aria-label="Wallet connection">
        <p id="wallet-status" class="address" role="status"></p>
        <label class="visually-hidden" for="wallet-choice">Wallet</label>
        <select id="wallet-choice">
          <option>No signing wallet detected</option>
        </select>
        <button id="connect-wallet" type="button">Connect wallet</button>
        <button id="disconnect-wallet" class="link-button" type="button" hidden>Disconnect</button>
      </section>
    </header>
    <main>
      <section class="intro">
        <h1>Know what can act on your wallet.</h1>
        <p class="lead">One view for permissions across Solana.</p>
      </section>
      <section class="search-panel" aria-label="Scan an address">
        <form id="scan-form">
          <label for="address">Scan a wallet, token account or authority</label>
          <div class="search-row">
            <input
              id="address"
              name="address"
              placeholder="Solana address"
              autocomplete="off"
              spellcheck="false"
              required
            /><button id="scan" type="submit" disabled>Scan</button>
          </div>
        </form>
        <div class="source-row">
          <label for="scenario">Source</label>
          <select id="scenario" disabled>
            <option>Loading observations...</option>
          </select>
          <div class="examples" id="examples" aria-label="Example addresses"></div>
        </div>
        <p class="scope-note"></p>
      </section>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="action-result" aria-live="polite" hidden></section>
      <nav class="tabs" aria-label="Views">
        <button id="scan-tab" class="selected" type="button">My permissions</button>
        <button id="diff-tab" type="button">Observed Diff</button>
      </nav>
      <section id="results" aria-label="Permissions"></section>
      <section id="detail" hidden aria-label="Permission detail"></section>
      <section id="diff" hidden aria-label="Observed permission changes"></section>
    </main>
    <dialog id="revoke-review" aria-label="Review revoke"></dialog>
    <footer>
      <strong>Velon</strong>
      <span
        >Every permission here is read from native state. Nothing is called revoked until it is observed
        again.</span
      >
      <a href="https://github.com/dakewamama/catalyst-demo">Source ↗</a>
    </footer>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
